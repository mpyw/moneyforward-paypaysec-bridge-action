name: 'PayPay 証券 / マニュライフ生命 → MoneyForward'
description: >-
  Read the holdings from a PayPay 証券 account, and optionally a マニュライフ生命
  contract's surrender value, and record them in MoneyForward manual accounts —
  one account per source.
author: mpyw

branding:
  icon: refresh-cw
  color: blue

# The inputs are internal/config, and nothing else is read from the
# environment. Adding one here means adding it there; there is no third place
# for a value to come from.
inputs:
  paypaysec-username:
    description: >-
      PayPay 証券 login ID (an email address). Optional, like every source:
      supply all of paypaysec-username, paypaysec-password and
      moneyforward-paypaysec-asset-id, or none of them.
    required: false
    default: ''
  paypaysec-password:
    description: 'PayPay 証券 password.'
    required: false
    default: ''
  moneyforward-email:
    description: >-
      MoneyForward login email address. Required: it is the account everything
      is recorded in, whichever sources a run reads.
    required: true
  moneyforward-password:
    description: 'MoneyForward password.'
    required: true
  moneyforward-paypaysec-asset-id:
    description: >-
      The account_id_hash of the MoneyForward manual account PayPay 証券's
      holdings are written into, taken from its page URL. Everything in that
      account is managed by this action: entries not matching a holding are
      deleted.

      One of the three paypaysec-* inputs — or moneyforward-asset-id, its
      former name, which still counts. Supply a source's inputs in full or not
      at all.
    required: false
    default: ''
  moneyforward-asset-id:
    description: >-
      Deprecated: the former name of moneyforward-paypaysec-asset-id, still
      read so that existing callers keep working. It became ambiguous once a
      second source got a manual account of its own — both are MoneyForward
      accounts, and what distinguishes them is whose holdings go in.

      Setting both to different values is an error rather than a preference:
      which account a run writes into is not something to guess at.
    required: false
    default: ''
  moneyforward-manulife-asset-id:
    description: >-
      The account_id_hash of the MoneyForward manual account マニュライフ生命's
      contract is recorded in — a different account from the PayPay 証券 one, so
      that a run which cannot read one source leaves the other's entries alone.

      One of the four manulife-* inputs. Supply all of them or none: a source
      with some of its credentials is not one that gets skipped, it is one that
      fails.
    required: false
    default: ''
  manulife-username:
    description: >-
      マニュライフ生命 マイページ login ID (an email address). Optional: leave the
      manulife-* inputs unset if there is no contract to record.
    required: false
    default: ''
  manulife-password:
    description: 'マニュライフ生命 マイページ password.'
    required: false
    default: ''
  manulife-acquisition-yen:
    description: >-
      What was actually paid for the single-premium contract, in yen — digits
      only, e.g. 4000000.

      Supplied rather than read, because the contract is denominated in a
      foreign currency and nothing on the site converts the premium at the rate
      it was struck at. Converting it at today's rate would give a cost that
      moves with the exchange rate, and a holding can be down in dollars while
      up in yen.

      Optional even with the other manulife-* inputs set. Left out, MoneyForward
      takes the cost to equal the value and reports a profit of exactly zero.
    required: false
    default: ''
  gmail-credentials:
    description: >-
      An authorized_user JSON credential scoped to gmail.readonly, for the
      mailbox both services send their one-time codes to. Produced by
      `mfpp debug gmail authorize`; a service account cannot read a consumer
      mailbox, so this is a user refresh token and must be treated as one.
    required: true
  allow-emptying-categories:
    description: >-
      Permit deleting every entry in a category. Off by default: every mis-read
      this scraper has had took that shape — a category holding two 銘柄 came
      back empty and both were deleted. Set it for one manual run when the
      holdings really were all sold.
    required: false
    default: ''
  go-version-file:
    description: 'Passed to actions/setup-go. Defaults to this action''s own go.mod.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Go
      # Pinned to a SHA rather than a tag, because a consumer cannot reach it.
      # This action runs inside their job with their brokerage credentials in
      # the environment; pinning `uses: mpyw/…-action@<sha>` on their side
      # freezes this file but not what this line resolves to. A tag here would
      # leave a hop in the chain that the person taking the risk cannot see.
      #
      # Dependabot keeps it current — see .github/dependabot.yml.
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file || format('{0}/go.mod', github.action_path) }}
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Download modules
      # Its own step so the Sync step's log is the sync. `go run` downloads on
      # demand otherwise, and a cold cache buries the first lines of the actual
      # job — the ones naming which target is being read — under module fetches.
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go mod download

    - name: Build
      # Also here rather than in Sync: compiler output is not sync output, and
      # on a cold cache it is the slower half. Sync then runs a binary that is
      # already built, so its first line is its first line.
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "${{ runner.temp }}/mfpp" ./cmd/mfpp

    - name: Check Chrome is available
      # chromedp drives whatever Chrome the runner already has. Asserted here so
      # a missing browser fails with this message rather than as a mid-scrape
      # timeout.
      shell: bash
      run: google-chrome --version || chromium-browser --version

    - name: Sync
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PAYPAYSEC_USERNAME: ${{ inputs.paypaysec-username }}
        PAYPAYSEC_PASSWORD: ${{ inputs.paypaysec-password }}
        MONEYFORWARD_EMAIL: ${{ inputs.moneyforward-email }}
        MONEYFORWARD_PASSWORD: ${{ inputs.moneyforward-password }}
        MONEYFORWARD_PAYPAYSEC_ASSET_ID: ${{ inputs.moneyforward-paypaysec-asset-id }}
        MONEYFORWARD_ASSET_ID: ${{ inputs.moneyforward-asset-id }}
        MONEYFORWARD_MANULIFE_ASSET_ID: ${{ inputs.moneyforward-manulife-asset-id }}
        MANULIFE_USERNAME: ${{ inputs.manulife-username }}
        MANULIFE_PASSWORD: ${{ inputs.manulife-password }}
        MANULIFE_ACQUISITION_YEN: ${{ inputs.manulife-acquisition-yen }}
        GMAIL_CREDENTIALS: ${{ inputs.gmail-credentials }}
        ALLOW_EMPTYING_CATEGORIES: ${{ inputs.allow-emptying-categories }}
      run: |
        # Mask the values this program will see before it runs. Balances and
        # one-time codes are masked by the program itself, as it reads them.
        #
        # A caller passing these from `secrets.*` gets GitHub's own masking too;
        # a caller passing a literal does not, and this is what covers them.
        # Guarded, because exactly one of the two asset-id names is normally
        # set and ::add-mask:: with an empty value is a directive that masks
        # nothing and says so in the log.
        echo "::add-mask::$PAYPAYSEC_USERNAME"
        echo "::add-mask::$MONEYFORWARD_EMAIL"
        [ -n "$MONEYFORWARD_PAYPAYSEC_ASSET_ID" ] && echo "::add-mask::$MONEYFORWARD_PAYPAYSEC_ASSET_ID"
        [ -n "$MONEYFORWARD_ASSET_ID" ] && echo "::add-mask::$MONEYFORWARD_ASSET_ID"
        [ -n "$MONEYFORWARD_MANULIFE_ASSET_ID" ] && echo "::add-mask::$MONEYFORWARD_MANULIFE_ASSET_ID"
        [ -n "$MANULIFE_USERNAME" ] && echo "::add-mask::$MANULIFE_USERNAME"
        [ -n "$MANULIFE_ACQUISITION_YEN" ] && echo "::add-mask::$MANULIFE_ACQUISITION_YEN"
        "${{ runner.temp }}/mfpp" sync
