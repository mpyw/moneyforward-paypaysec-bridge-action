name: ci

# Nothing ran this code on a runner except the scheduled job, which needs live
# credentials and gets one attempt a day. A break introduced on a Tuesday was
# only discoverable on Wednesday evening, in a run that also writes to a
# financial record.
#
# Every check here is credential-free and touches no external site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: actionlint
        # The workflows are the one thing here that nothing else compiles.
        # Disabling the schedule by commenting out its only cron entry left
        # `schedule:` with no value, which is valid YAML and an invalid
        # workflow — so the file could not be run at all, and nothing said so
        # until someone tried. This is that check.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: no source file is ignored
        # A .gitignore pattern matching a package directory removes its files
        # from the build without saying so: `git add -A` skips an ignored path
        # silently, and the package keeps compiling locally from whatever was
        # already tracked. `secrets/` unanchored did exactly that to
        # internal/cli/commands/secrets, and CI only noticed because the missing
        # file happened to be one the build needed.
        run: |
          ignored="$(git ls-files --others --ignored --exclude-standard -- '*.go' '*.md' '*.yml' '*.js')"
          if [ -n "$ignored" ]; then
            echo "::error::these files are gitignored and are not in the repository:"
            echo "$ignored"
            exit 1
          fi

      - name: gofmt
        # Reported as a diff rather than a list of names: the point of failing
        # is to show what to change.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: wire is up to date
        # After the type checks, deliberately: wire reads a package through
        # go/packages, and given stale type information it will happily write
        # back what is already there.
        #
        # Every injector, not just the scheduled job's. The graphs are
        # generated, so a provider can change without wire_gen.go following. A
        # changed signature at least fails to compile; a changed graph shape
        # does not, and this is what catches that.
        run: |
          go run github.com/google/wire/cmd/wire ./internal/cli/commands/...
          if ! git diff --quiet -- '*/wire_gen.go'; then
            echo "::error::a wire_gen.go is stale; run: go run github.com/google/wire/cmd/wire ./internal/cli/commands/..."
            git diff -- '*/wire_gen.go'
            exit 1
          fi

      - name: go vet (live tags)
        # The live selector tests are excluded from the default build, so a
        # compile error in them is otherwise invisible until someone runs them.
        run: go vet -tags live ./...

      - name: Read the golangci-lint pin
        # mise.toml is the single declaration of it, and this reads that rather
        # than repeating the number.
        #
        # The pin has a floor: golangci-lint refuses to run when the Go it was
        # built with is older than the version go.mod targets, so raising the
        # language version means raising this too. It fails loudly — "can't load
        # config", naming both versions — where older ones did something worse
        # and reported success having checked nothing.
        #
        # Two pins kept in step by care is exactly how a local run and CI come to
        # check different things, and that is the failure this repository keeps
        # closing with a test. There is no test for a workflow file, so the
        # duplicate is removed instead.
        id: lint-version
        run: |
          version=$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' mise.toml)
          if [ -z "$version" ]; then
            echo "::error::no golangci-lint pin found in mise.toml"
            exit 1
          fi
          echo "version=v$version" >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        # Two passes because the build tags select disjoint files. The default
        # one never sees wire.go, so every wire.NewSet in it reads as unused;
        # the wireinject one never sees wire_gen.go. Neither alone covers the
        # package.
        #
        # This ran only on a laptop until now, which is how it found things —
        # unparam on a provider that could not vary, staticcheck on a check that
        # could not fail — that nothing in this file would have.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint-version.outputs.version }}

      - name: golangci-lint (wireinject tags)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint-version.outputs.version }}
          args: --build-tags wireinject

      - name: Check Chrome is available
        # Asserted before the tests so a missing browser is reported as itself
        # rather than as every browser test skipping quietly.
        run: google-chrome --version || chromium-browser --version

      - name: go test
        # Includes the launch test, which starts headless Chrome with the same
        # options the scheduled job uses. That combination — specifically
        # --no-sandbox on a GitHub-hosted runner — is what fifty consecutive
        # scheduled runs died on, and it cannot be checked on a laptop.
        run: go test -race ./...

      - name: go build
        run: go build ./...
